<svg width="512" height="512" viewBox="0 0 512 512" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>RI Logo</title>
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ede9fe;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg1)"/>
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#shimmer)"/>
  <rect x="6" y="6" width="500" height="500" rx="95" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2.5"/>

  <!-- Laptop body -->
  <rect x="106" y="170" width="300" height="184" rx="12" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="3"/>
  <!-- Laptop screen -->
  <rect x="122" y="186" width="268" height="152" rx="6" fill="#0f0a1e"/>
  <rect x="122" y="186" width="268" height="152" rx="6" fill="#7c3aed" fill-opacity="0.18"/>

  <!-- RI text on screen -->
  <text x="256" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="82" font-weight="700" fill="#ede9fe" letter-spacing="6">RI</text>

  <!-- Laptop keyboard base -->
  <rect x="76" y="354" width="360" height="22" rx="6" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="186" y="354" width="140" height="10" rx="3" fill="#0f0a1e"/>

  <!-- Decorative dots top right -->
  <circle cx="432" cy="82" r="10" fill="#c4b5fd" fill-opacity="0.5"/>
  <circle cx="456" cy="60" r="7" fill="#c4b5fd" fill-opacity="0.35"/>
  <circle cx="446" cy="46" r="5" fill="#c4b5fd" fill-opacity="0.2"/>

  <!-- Decorative dots bottom left -->
  <circle cx="80" cy="438" r="10" fill="#c4b5fd" fill-opacity="0.5"/>
  <circle cx="58" cy="458" r="7" fill="#c4b5fd" fill-opacity="0.35"/>
  <circle cx="68" cy="474" r="5" fill="#c4b5fd" fill-opacity="0.2"/>
</svg>